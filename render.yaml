services:
  - type: web
    name: alsaha-multiplayer
    runtime: node
    plan: starter
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/alsaha.sqlite
    disk:
      name: alsaha-data
      mountPath: /var/data
      sizeGB: 1
